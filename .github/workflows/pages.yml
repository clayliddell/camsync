name: Deploy CamSync to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Check retention rules and JavaScript syntax
        run: |
          node --test tests/core.test.cjs
          node --check app.js
          node --check sw.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Package static app
        run: |
          mkdir -p _site
          cp index.html privacy.html update.html styles.css app.js core.js config.js sw.js manifest.webmanifest CNAME .nojekyll _site/
          cp -R icons _site/icons
      - name: Upload app artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - name: Deploy app
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
